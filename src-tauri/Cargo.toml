[package]
name = "ai-usage-widget"
version = "0.1.3"
description = "tok.io"
authors = ["Diulio Aires"]
edition = "2021"

[lib]
name = "ai_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
notify = "8.2.0"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }

[target."cfg(windows)".dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
